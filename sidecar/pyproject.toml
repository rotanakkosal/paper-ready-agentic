[project]
name = "paperready-sidecar"
version = "0.1.0"
description = "PaperReady sidecar — PDF parsing + CSV lookups for the n8n agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.11.0",
]

[tool.uv]
package = false
